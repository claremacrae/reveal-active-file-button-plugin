name: Verify Commit
on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: Install modules
        run: npm install

      - name: Run TypeScript compiler and Obsidian ESLint
        run: npm run lint

      - name: Run build
        run: npm run build
